<div class="input">
  <div class="input-label">
    <label [for]="id" class="form-label">{{ label }}</label>
  </div>

  <div class="input-group">
    @if (startAddon) {
      <span class="input-group-text">{{ startAddon }}</span>
    }

    <div class="response text-input">
      <input
        [type]="type"
        class="form-control"
        [id]="id"
        [attr.name]="name || null"
        [value]="value"
        [placeholder]="placeholder"
        [disabled]="disabled"
        [readOnly]="readonly"
      />
    </div>

    @if (endAddon) {
      <span class="input-group-text">{{ endAddon }}</span>
    }

    @for (action of actions; track action.label) {
      <button
        [type]="action.type || 'button'"
        class="btn btn-response"
        [disabled]="action.disabled || false"
      >
        <span class="button-label">{{ action.label }}</span>
      </button>
    }
  </div>
</div>
